name: Match and Merge Catalogs

on:
  workflow_dispatch:
  push:
    paths:
      - 'ostrovok-data/catalog/*.csv'
      - 'tvil-data/catalog/*.csv'

jobs:
  merge-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install thefuzz python-Levenshtein

      - name: Create output directories
        run: |
          mkdir -p matching/match-results
          mkdir -p matching/merge-results
          mkdir -p matching/logs

      - name: Run Fuzzy Matcher
        run: |
          python -u matching/fuzzy-matcher2.py

      - name: Run Catalog Merger
        run: |
          python -u matching/mergeintoone.py

      - name: Run Daily Stats Builder
        run: |
          python -u matching/build-stats.py

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and push merged catalog
        run: |
          git add matching/match-results/ matching/merge-results/ matching/logs/ all-data/*.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes in merged catalog"
          else
            git commit -m "Update merged catalog - $(date +'%Y-%m-%d %H:%M')"
            git push
          fi